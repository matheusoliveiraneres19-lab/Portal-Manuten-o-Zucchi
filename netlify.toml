# Configuração de deploy na Netlify.
# O Prisma Client é gerado no install via "postinstall": "prisma generate" (package.json).
# O plugin oficial @netlify/plugin-nextjs cuida do publish/funções do Next.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Variáveis a configurar no painel da Netlify (Site settings > Environment variables):
#
#   DATABASE_URL  -> conexão POOLED do Supabase (Transaction mode, porta 6543, pgbouncer).
#       Obrigatória em serverless para não esgotar conexões. Ver .env.example.
#   DIRECT_URL    -> conexão DIRETA do Supabase (porta 5432), usada por migrations.
#
#   Se DATABASE_URL não responder, o login cai num fallback temporário de testes
#   (ver src/app/api/auth/login/route.ts). SQLite (file:./dev.db) NÃO funciona em serverless.
